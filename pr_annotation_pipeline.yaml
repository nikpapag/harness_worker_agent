pipeline:
  name: CI Demo
  identifier: Agent_Demo_Pipeline
  projectIdentifier: devx_ai_1
  orgIdentifier: sandbox
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: github
        repoName: monorepo
        build: <+input>
  stages:
    - stage:
        name: Build
        identifier: Build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: false
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Detect PR Changes
                  identifier: detect_pr_changes
                  spec:
                    shell: Sh
                    command: |-
                      echo "PRE-FLIGHT GOVERNANCE CHECK"

                      BASE_SHA="<+codebase.baseCommitSha>"
                      HEAD_SHA="<+codebase.commitSha>"

                      echo "Base SHA: $BASE_SHA"
                      echo "Head SHA: $HEAD_SHA"

                      # Make sure we have enough Git history
                      if [ -f .git/shallow ]; then
                        git fetch --unshallow origin
                      else
                        git fetch origin
                      fi

                      # Get unique second-level paths
                      # Example:
                      # monorepo/app-team-a/src/main.py
                      # monorepo/app-team-b/src/main.py
                      #
                      # Becomes:
                      # monorepo/app-team-a
                      # monorepo/app-team-b

                      CHANGED_APPS="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" \
                        | awk -F'/' 'NF >= 2 {print $1 "/" $2}' \
                        | sort -u)"

                      echo "Changed applications:"
                      echo "$CHANGED_APPS"

                      PAYLOAD='{"a":['
                      FIRST=true

                      for APP_PATH in $CHANGED_APPS; do

                        echo "-----------------------------------"
                        echo "App Path: $APP_PATH"

                        MONOREPO=$(echo "$APP_PATH" | cut -d'/' -f1)

                        APP_NAME=$(echo "$APP_PATH" | cut -d'/' -f2)

                        LANGUAGE=$(echo "$APP_NAME" | cut -d'-' -f2)

                        TEAM=$(echo "$APP_NAME" | cut -d'-' -f3)

                        APP_NUM=$(echo "$APP_NAME" | sed -n 's/.*app\([0-9][0-9]*\).*/\1/p')

                        case "$APP_NUM" in
                          1|4|7)
                            BUILD_SIZE="large"
                            ;;
                          *)
                            BUILD_SIZE="small"
                            ;;
                        esac

                        if [ "$MONOREPO" = "monorepo-foo" ]; then
                          COVERAGE="80"
                          PIPELINE_TYPE="Guild-recommended"
                        else
                          COVERAGE="70"
                          PIPELINE_TYPE="Custom"
                        fi

                        echo "Parsed: $MONOREPO / $APP_NAME"
                        echo "Language: $LANGUAGE | Team: $TEAM | Size: $BUILD_SIZE"
                        echo "Coverage: $COVERAGE% | Type: $PIPELINE_TYPE"

                        if [ "$FIRST" = true ]; then
                          FIRST=false
                        else
                          PAYLOAD="$PAYLOAD,"
                        fi

                        PAYLOAD="$PAYLOAD{\"file_path\":\"$APP_PATH\",\"language\":\"$LANGUAGE\"}"

                      done

                      PAYLOAD="$PAYLOAD]}"

                      echo "-----------------------------------"
                      echo "Generated Payload:"
                      echo "$PAYLOAD"

                      export PAYLOAD
                    outputVariables:
                      - name: PAYLOAD
                        type: String
                        value: PAYLOAD
    - stage:
        name: Build_Paths
        identifier: Build_Paths
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: false
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Gitleaks
                  name: Gitleaks
                  identifier: Gitleaks
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: repository
                      detection: auto
                    advanced:
                      log:
                        level: info
              - parallel:
                  - step:
                      type: Test
                      name: Python Test
                      identifier: Python_Test
                      spec:
                        shell: Sh
                        command: |+

                          cd <+matrix.service.file_path>
                          # Install dependencies
                          pip install -q -r requirements.txt pytest pytest-cov coverage

                          export PYTHONPATH="${PWD}:${PYTHONPATH}"
                          # Run tests with coverage
                          pytest -v \
                            --cov=app \
                            --cov=. \
                            --cov-report=xml:coverage.xml \
                            --cov-report=term-missing \
                            --junitxml=test-results.xml
                          # Generate LCOV for Harness
                          coverage lcov -o lcov.info
                          coverage report

                          # Upload to Harness
                          echo ""
                          echo "Uploading to Harness..."
                          hcli cov upload --file=lcov.info ||  echo "Coverage upload skipped"
                          hcli cov wait-until --gt=70 --patch-gt=80 --timeout=1m || echo "Quality gate check skipped"


                        reports:
                          type: JUnit
                          spec:
                            paths:
                              - <+matrix.service.file_path>/**/.*.xml
                        envVariables:
                          CI_ENABLE_HCLI_FOR_TESTS: "true"
                        intelligenceMode: true
                      when:
                        stageStatus: Success
                        condition: <+matrix.service.language> == "python"
                  - step:
                      type: Test
                      name: Java Test
                      identifier: Java_Test
                      spec:
                        shell: Sh
                        command: |+
                          cd <+matrix.service.file_path>

                          # Clean, compile, test with coverage
                          mvn clean test jacoco:report
                          # Show test summary
                          echo "Tests completed. Results in target/surefire-reports/"

                          # Upload coverage (NOT test results)
                          hcli cov upload --file=target/site/jacoco/jacoco.xml
                          hcli cov wait-until --gt=60 --patch-gt=70 --timeout=1m

                        reports:
                          type: JUnit
                          spec:
                            paths:
                              - <+matrix.servivce.file_path>/**/*.xml
                        envVariables:
                          CI_ENABLE_HCLI_FOR_TESTS: "true"
                        intelligenceMode: true
                      when:
                        stageStatus: Success
                        condition: <+matrix.service.language> == "java"
              - parallel:
                  - step:
                      type: Owasp
                      name: OWASP
                      identifier: OWASP
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: repository
                          workspace: /harness/<+matrix.service.file_path>
                          detection: auto
                        advanced:
                          log:
                            level: info
                  - step:
                      type: Semgrep
                      name: Semgrep
                      identifier: Semgrep
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: repository
                          workspace: /harness/<+matrix.service.file_path>
                          detection: auto
                        advanced:
                          log:
                            level: info
              - step:
                  type: BuildAndPushDockerRegistry
                  name: BuildAndPushDockerRegistry_1
                  identifier: BuildAndPushDockerRegistry_1
                  spec:
                    repo: <+<+matrix.service.file_path>.toLowerCase()>
                    tags:
                      - <+pipeline.sequenceId>
                    caching: true
                    dockerfile: <+matrix.service.file_path>/Dockerfile
                    context: <+matrix.service.file_path>
                    registryRef: devx_ai_registry
              - parallel:
                  - step:
                      type: SscaOrchestration
                      name: SBOM Orchestration_1
                      identifier: SBOMOrchestration_1
                      spec:
                        mode: generation
                        tool:
                          type: Syft
                          spec:
                            format: spdx-json
                        source:
                          type: har
                          spec:
                            registry: devx_ai_registry
                            image: <+<+matrix.service.file_path>.toLowerCase()>:<+pipeline.sequenceId>
                        attestation:
                          type: keyless
                          spec:
                            oidcProvider: harness
                        sbom_drift:
                          base: last_generated_sbom
                        resources:
                          limits:
                            memory: 500Mi
                            cpu: "0.5"
                  - step:
                      type: Background
                      name: dind
                      identifier: dind
                      spec:
                        connectorRef: account.harnessImage
                        image: docker:dind
                        shell: Sh
                  - step:
                      type: AquaTrivy
                      name: AquaTrivy_1
                      identifier: AquaTrivy_1
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: container
                          detection: auto
                        advanced:
                          log:
                            level: info
                        privileged: true
                        image:
                          type: harness
                          tag: latest
                          registry: devx_ai_registry
                          image_path: <+<+matrix.service.file_path>.toLowerCase()>:<+pipeline.sequenceId>
                        sbom:
                          format: spdx-json
                      enforce:
                        policySets:
                          - seCURITY
              - step:
                  type: Agent
                  name: Agent
                  identifier: Agent
                  spec:
                    agentName: ca_pr_annotation_agent
                    agentSettings:
                      llmConnector: account.harnessAnthropic
                      mcpConnectors:
                        - GitHub_MCP_Server
                        - Harness_MCP_server
                      modelName: claude-sonnet-4-6
                      prUrl: <+codebase.pullRequestLink>
                    envVariables:
                      HARNESS_ACCOUNT_ID: <+account.identifier>
                      HARNESS_ORG_ID: <+org.identifier>
                      HARNESS_PROJECT_ID: <+project.identifier>
                      HARNESS_PIPELINE_ID: <+pipeline.identifier>
                      HARNESS_EXECUTION_ID: <+pipeline.executionId>
                  when:
                    stageStatus: All
          sharedPaths:
            - /var/run
        when:
          pipelineStatus: Success
          condition: <+<+matrix.service.file_path>.contains("monorepo-foo")>
        strategy:
          matrix:
            service: <+json.list("a", <+pipeline.stages.Build.spec.execution.steps.detect_pr_changes.output.outputVariables.PAYLOAD>)>
        sendGitStatus:
          enabled: true
          name: "Harness CI "
